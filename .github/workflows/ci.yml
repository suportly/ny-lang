name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  LLVM_SYS_181_PREFIX: /usr/lib/llvm-18

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- 18
          sudo apt-get install -y llvm-18-dev libpolly-18-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test

      - name: Type-check all examples and stdlib
        run: |
          failed=0

          # Examples are complete programs: check them directly.
          for f in examples/*.ny; do
            [ -e "$f" ] || continue
            if ./target/debug/ny check "$f" >/dev/null 2>&1; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              ./target/debug/ny check "$f" || true
              failed=1
            fi
          done

          # stdlib modules are libraries with no `main`, so check each one
          # through a generated shim that imports it.
          shim=$(mktemp -d)/shim.ny
          for f in stdlib/*.ny; do
            [ -e "$f" ] || continue
            printf 'use "%s";\n\nfn main() -> i32 { return 0; }\n' "$f" > "$shim"
            if ./target/debug/ny check "$shim" >/dev/null 2>&1; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              ./target/debug/ny check "$shim" || true
              failed=1
            fi
          done

          exit $failed
